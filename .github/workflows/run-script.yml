name: Executar Scrap Diário

on:
  schedule:
    - cron: '1 3 * * 1'   # 03:00 UTC (00:00 Brasil)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Necessário para permitir push

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar script
        run: python scrap_mesaquest.py

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"

          # Captura criações, modificações e deleções
          git add -A

          # Só commita se houver mudanças
          if ! git diff --cached --quiet; then
            git commit -m "Atualização automática do scrap diário"
            git push
          else
            echo "Nenhuma alteração detectada."
          fi
